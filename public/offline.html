<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Paws Playcare</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #eaeef4;
        color: #333a41;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 32px 28px;
        max-width: 360px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      img { width: 120px; height: 120px; }
      h1 { font-size: 20px; margin: 12px 0 6px; }
      p { color: #64748b; font-size: 15px; margin: 0 0 20px; line-height: 1.5; }
      button {
        background: #2ea6d8;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Paws Playcare" />
      <h1>You're offline</h1>
      <p>We can't reach Paws Playcare right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
